<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>IFL — International Football League</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <!-- Shown only on desktop (mouse/trackpad) if the window is narrow/portrait-shaped.
       Mobile/touch devices never see this — they support both orientations. -->
  <div id="orientation-lock">
    <div class="orientation-lock-inner">
      <div class="orientation-icon">🖥️</div>
      <p>IFL è pensato per l'uso in orizzontale.<br>Allarga la finestra del browser.</p>
    </div>
  </div>


  <!-- ============ MAIN MENU ============ -->
  <section id="screen-menu" class="screen active menu-screen">
    <div class="menu-bg"></div>
    <div class="menu-vignette"></div>
    <div class="menu-content">
      <img src="assets/logo/ifl-logo.png" alt="IFL — International Football League" class="menu-logo">

      <div class="tile-grid">
        <button class="tile tile-hero" data-action="new-career">
          <div class="tile-glow"></div>
          <span class="tile-eyebrow">Inizia da zero</span>
          <span class="tile-title">Nuova Carriera</span>
          <span class="tile-desc">Crea il tuo calciatore e scrivi la sua storia, dagli esordi al ritiro.</span>
        </button>

        <button class="tile" data-action="continue-career">
          <span class="tile-icon">▶</span>
          <span class="tile-title-sm">Continua</span>
          <span class="tile-desc-sm">Riprendi la carriera salvata</span>
        </button>

        <button class="tile" data-action="leaderboard">
          <span class="tile-icon">🏆</span>
          <span class="tile-title-sm">Classifica</span>
          <span class="tile-desc-sm">Le leggende di IFL</span>
        </button>

        <button class="tile" data-action="how-to-play">
          <span class="tile-icon">❓</span>
          <span class="tile-title-sm">Come si gioca</span>
          <span class="tile-desc-sm">Guida rapida</span>
        </button>

        <button class="tile" data-action="settings">
          <span class="tile-icon">⚙</span>
          <span class="tile-title-sm">Impostazioni</span>
          <span class="tile-desc-sm">Audio, dati, salvataggi</span>
        </button>
      </div>

      <div class="menu-footer">IFL 2026 · International Football League</div>
    </div>
  </section>

  <!-- ============ PLAYER CREATION (WIZARD) ============ -->
  <section id="screen-create" class="screen">
    <header class="subheader">
      <button class="back-btn" data-action="back-to-menu">‹ Menu</button>
      <h1>Crea il tuo calciatore</h1>
    </header>

    <div class="wizard-dots">
      <div class="wizard-dot active" data-step="1"><span>1</span>Identità</div>
      <div class="wizard-dot" data-step="2"><span>2</span>Aspetto</div>
      <div class="wizard-dot" data-step="3"><span>3</span>Riepilogo</div>
    </div>

    <div class="create-form-wrap">
      <!-- STEP 1: identity & role -->
      <form id="create-form" class="create-form wizard-step active" data-step="1">
        <div class="form-row">
          <label>Nome<input required maxlength="16" type="text" name="firstName" placeholder="Es. Marco"></label>
          <label>Cognome<input required maxlength="16" type="text" name="lastName" placeholder="Es. Rinaldi"></label>
        </div>
        <div class="form-row">
          <label>Nome sulla maglia<input maxlength="12" type="text" name="shirtName" placeholder="Auto dal cognome"></label>
          <label>Numero di maglia<input required type="number" name="shirtNumber" min="1" max="99" value="10"></label>
        </div>
        <div class="form-row">
          <label>Età<input required type="number" name="age" min="16" max="21" value="17"></label>
          <label>Altezza (cm)<input required type="number" name="height" min="160" max="205" value="180"></label>
        </div>
        <div class="form-row">
          <label>Nazionalità
            <select name="nationality"></select>
          </label>
          <label>Piede preferito
            <select name="foot">
              <option value="Destro">Destro</option>
              <option value="Sinistro">Sinistro</option>
              <option value="Ambidestro">Ambidestro</option>
            </select>
          </label>
        </div>
        <div class="form-row">
          <label>Posizione
            <select name="position" id="position-select"></select>
          </label>
          <label>Stile di gioco
            <select name="style" id="style-select"></select>
          </label>
        </div>
        <div class="form-row">
          <label class="full">Club iniziale
            <select name="club" id="club-select"></select>
          </label>
        </div>
        <div id="stat-preview" class="stat-preview"></div>
        <button type="button" class="menu-btn-primary form-submit" data-action="wizard-next">Continua</button>
      </form>

      <!-- STEP 2: appearance -->
      <div class="wizard-step" data-step="2">
        <div class="create-form">
          <h3 class="wizard-heading">Scegli l'identità estetica</h3>
          <p class="wizard-hint">Un tema cromatico per la tua card giocatore e la tua identità in IFL.</p>
          <div class="appearance-grid" id="appearance-grid"></div>
          <div class="btn-row" style="margin-top:18px;">
            <button class="btn-sm" data-action="wizard-back">‹ Indietro</button>
            <button class="menu-btn-primary form-submit" data-action="wizard-review" style="flex:1;">Vedi riepilogo</button>
          </div>
        </div>
      </div>

      <!-- STEP 3: summary -->
      <div class="wizard-step" data-step="3">
        <div class="create-form">
          <h3 class="wizard-heading">Riepilogo calciatore</h3>
          <div id="summary-content"></div>
          <div class="btn-row" style="margin-top:18px;">
            <button class="btn-sm" data-action="wizard-back-2">‹ Modifica</button>
            <button class="menu-btn-primary form-submit" data-action="confirm-career" style="flex:1;">Inizia la carriera</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ HUB / DASHBOARD ============ -->
  <section id="screen-hub" class="screen">
    <div class="hub-bg"></div>
    <header class="hub-header">
      <div class="hub-identity">
        <div class="hub-avatar" id="hub-avatar"></div>
        <div>
          <div class="hub-name" id="hub-name">—</div>
          <div class="hub-sub" id="hub-sub">—</div>
        </div>
      </div>
      <div class="hub-stats-mini" id="hub-stats-mini"></div>
      <button class="icon-btn" data-action="back-to-menu" title="Esci al menu">⏻</button>
    </header>

    <nav class="hub-tabs">
      <button class="hub-tab active" data-tab="overview">Home</button>
      <button class="hub-tab" data-tab="squad">Profilo</button>
      <button class="hub-tab" data-tab="stats">Statistiche</button>
      <button class="hub-tab" data-tab="calendar">Calendario</button>
      <button class="hub-tab" data-tab="standings">Classifica</button>
      <button class="hub-tab" data-tab="objectives">Obiettivi</button>
      <button class="hub-tab" data-tab="training">Allenamento</button>
      <button class="hub-tab" data-tab="national">Nazionale</button>
      <button class="hub-tab" data-tab="market">Mercato</button>
      <button class="hub-tab" data-tab="notifications">Notifiche <span class="tab-badge" id="notif-badge"></span></button>
      <button class="hub-tab" data-tab="settings">Impostazioni</button>
    </nav>

    <div class="hub-body" id="hub-body">
      <!-- injected per tab -->
    </div>

    <footer class="hub-footer">
      <button class="menu-btn-primary" id="advance-btn" data-action="advance">Gioca prossima partita</button>
    </footer>
  </section>

  <!-- ============ MODAL LAYER ============ -->
  <div id="modal-layer" class="modal-layer hidden">
    <div class="modal-box" id="modal-box"></div>
  </div>

  <!-- ============ RETIREMENT SCREEN ============ -->
  <section id="screen-retire" class="screen retire-screen">
    <div class="retire-content" id="retire-content"></div>
  </section>

</div>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/player.js"></script>
<script src="js/simulation.js"></script>
<script src="js/events.js"></script>
<script src="js/career.js"></script>
<script src="js/awards.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
